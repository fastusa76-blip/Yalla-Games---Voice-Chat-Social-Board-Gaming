<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Yalla Games — Order Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:50px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.admin-head h1{font:700 38px 'Space Grotesk';letter-spacing:-1px}.admin-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:20px 0}.admin-form{display:flex;gap:10px;flex-wrap:wrap}.admin-form input{flex:1;min-width:230px;border:1px solid var(--line);padding:12px;border-radius:8px}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}.admin-table select,.admin-table input{padding:8px;border:1px solid var(--line);border-radius:6px}.admin-table button{border:0;background:var(--purple);color:#fff;padding:8px 10px;border-radius:6px;cursor:pointer}.status{font-weight:700;text-transform:capitalize}.notice{font-size:12px;color:var(--muted);margin-top:12px}.table-scroll{overflow-x:auto}@media(max-width:650px){.admin-head h1{font-size:30px}.admin-table{min-width:780px}}
</style></head><body><div class="announcement">YALLA GAMES · PRIVATE ADMIN AREA</div><main class="admin-wrap"><div class="admin-head"><div><p class="eyebrow">ORDER MANAGEMENT</p><h1>Orders dashboard</h1></div><a class="text-link" href="index.html">View storefront ↗</a></div><section class="admin-panel"><h2 style="font:600 18px 'Space Grotesk'">Administrator sign-in</h2><form id="loginForm" class="admin-form"><input id="adminKey" type="password" autocomplete="current-password" placeholder="Admin API key" required><button class="button" type="submit">Load orders ↗</button></form><p id="notice" class="notice" role="status">Your key is kept only in this browser tab and is not saved to the server.</p></section><section class="admin-panel"><div class="table-scroll"><table class="admin-table"><thead><tr><th>Reference / Date</th><th>Customer</th><th>Game</th><th>Qty</th><th>Status</th><th>Admin note</th><th>Action</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7">Sign in to load orders.</td></tr></tbody></table></div></section></main><script src="admin.js" defer></script></body></html>
